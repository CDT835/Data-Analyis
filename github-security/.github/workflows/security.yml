# Quét bảo mật mỗi lần đẩy code và mỗi tuần: lỗ hổng trong thư viện (pip-audit) + khóa bí mật lỡ đưa vào repo (gitleaks).
name: security
on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * 1"
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Sửa đường dẫn nếu requirements.txt nằm ở chỗ khác
      - run: pip-audit -r ai-report-service/requirements.txt
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
